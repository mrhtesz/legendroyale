<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanted Realms Battle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu Screen -->
        <div id="menu-screen" class="screen active">
            <div class="menu-container">
                <h1 id="game-title">Enchanted Realms Battle</h1>
                <div class="player-stats">
                    <div class="honor-display">
                        <span id="honor-label">Honor Points</span>: <span id="honor-points">0</span>
                    </div>
                    <div class="arena-display">
                        <span id="current-arena-label">Current Arena</span>: <span id="current-arena">Forest Glade</span>
                    </div>
                </div>
                <div class="menu-buttons">
                    <button id="play-button" class="menu-btn">Play Battle</button>
                    <button id="deck-button" class="menu-btn">Deck Builder</button>
                    <button id="cards-button" class="menu-btn">Card Collection</button>
                </div>
                <div class="language-selector">
                    <label for="language-select" id="language-label">Language:</label>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="tr">Türkçe</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Deck Builder Screen -->
        <div id="deck-screen" class="screen">
            <div class="deck-container">
                <h2 id="deck-title">Deck Builder</h2>
                <div class="deck-section">
                    <h3 id="current-deck-label">Current Deck (8/8)</h3>
                    <div id="current-deck" class="deck-cards"></div>
                </div>
                <div class="collection-section">
                    <h3 id="available-cards-label">Available Cards</h3>
                    <div id="available-cards" class="collection-cards"></div>
                </div>
                <button id="back-to-menu" class="menu-btn">Back to Menu</button>
            </div>
        </div>

        <!-- Card Collection Screen -->
        <div id="collection-screen" class="screen">
            <div class="collection-container">
                <h2 id="collection-title">Card Collection</h2>
                <div id="all-cards" class="collection-cards"></div>
                <button id="back-to-menu-2" class="menu-btn">Back to Menu</button>
            </div>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" class="screen">
            <div class="battle-container">
                <!-- Top UI -->
                <div class="battle-top-ui">
                    <div class="timer-container">
                        <span id="battle-timer">3:00</span>
                    </div>
                    <div class="totems-health">
                        <div class="enemy-totems">
                            <div class="totem-health" id="enemy-left-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">1000</span>
                            </div>
                            <div class="totem-health main-totem" id="enemy-main-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">2000</span>
                            </div>
                            <div class="totem-health" id="enemy-right-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">1000</span>
                            </div>
                        </div>
                        <div class="player-totems">
                            <div class="totem-health" id="player-left-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">1000</span>
                            </div>
                            <div class="totem-health main-totem" id="player-main-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">2000</span>
                            </div>
                            <div class="totem-health" id="player-right-totem">
                                <div class="health-bar"><div class="health-fill"></div></div>
                                <span class="health-text">1000</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Battle Field -->
                <div class="battle-field" id="battle-field">
                    <canvas id="game-canvas" width="800" height="600"></canvas>
                </div>

                <!-- Bottom UI -->
                <div class="battle-bottom-ui">
                    <div class="momentum-display">
                        <div class="momentum-orb">
                            <span id="momentum-text">3/12</span>
                        </div>
                    </div>
                    <div class="hand-cards" id="hand-cards">
                        <!-- Cards will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Battle Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-container">
                <h2 id="result-title">Battle Result</h2>
                <div class="result-content">
                    <div id="result-message" class="result-message"></div>
                    <div id="honor-change" class="honor-change"></div>
                </div>
                <button id="continue-button" class="menu-btn">Continue</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="localization.js"></script>
    <script src="cards.js"></script>
    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
